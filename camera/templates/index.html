<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GraviPi Camera Controls</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div>
      <h1>GraviPi Camera</h1>
      <p id="device">Loading camera…</p>
    </div>
    <div class="actions">
      <button id="refresh" type="button">Refresh values</button>
      <button id="reset" type="button" class="secondary">Reset to defaults</button>
    </div>
  </header>

  <div id="error" role="alert" hidden></div>
  <div id="notice" role="status" hidden></div>

  <main>
    <section class="preview-panel">
      <h2>Live preview</h2>
      <img src="{{ stream_url }}" alt="Live MJPEG camera preview">
    </section>
    <section class="controls-panel">
      <h2>V4L2 controls</h2>
      <div id="controls" aria-live="polite"></div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
